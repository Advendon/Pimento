version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drop-of-colour-db
    environment:
      POSTGRES_DB: drop_of_colour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drop-of-colour-network

  app:
    build: .
    container_name: drop-of-colour-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=drop_of_colour
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=your-production-jwt-secret
    depends_on:
      - postgres
    networks:
      - drop-of-colour-network

volumes:
  postgres_data:

networks:
  drop-of-colour-network:
    driver: bridge